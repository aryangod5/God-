# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the
# command line. Check build.gradle for more details.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and does not include a dependency's R class.
# This property is particularly useful for large projects that use many library
# dependencies to avoid the problem of constant resource collisions.

android.useNamespace=true

# Gradle memory settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m

# Gradle version for wrapper
gradle.version=8.13

# Kotlin language version
kotlin.jvmTarget=11
